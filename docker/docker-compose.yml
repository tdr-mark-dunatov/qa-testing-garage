services:
  # PostgreSQL Database - Production-ready database for compliance data
  db:
    image: postgres:15-alpine
    container_name: compliance-guardian-db
    environment:
      - POSTGRES_USER=compliance
      - POSTGRES_PASSWORD=guardian_secure_123
      - POSTGRES_DB=webhooks
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - pitstop-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compliance"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../apps/webhook-inspector/api
      dockerfile: Dockerfile
    container_name: compliance-guardian-backend
    ports:
      - "8000:8000"
    volumes:
      - ../apps/webhook-inspector/api:/app
      - pitstop-data:/app/data
    environment:
      - DATABASE_URL=postgresql://compliance:guardian_secure_123@db:5432/webhooks
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pitstop-network
    restart: unless-stopped

  frontend:
    build:
      context: ../apps/webhook-inspector/web
      dockerfile: Dockerfile
    container_name: compliance-guardian-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - pitstop-network
    restart: unless-stopped

volumes:
  pitstop-data:
    driver: local
  postgres-data:
    driver: local

networks:
  pitstop-network:
    driver: bridge
