[tool.poetry]
name = "webhook-pitstop-api"
version = "1.0.0"
description = "🏁 Webhook Pitstop - FastAPI backend with WebSockets"
authors = ["Mark Dunatov <mark@example.com>"]
readme = "README.md"
packages = [{include = "*.py"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
sqlalchemy = "^2.0.23"
pydantic = "^2.5.0"
python-multipart = "^0.0.6"
websockets = "^12.0"
psycopg = {extras = ["binary"], version = "^3.1.12"}

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
pytest-bdd = "^7.0.0"
httpx = "^0.25.2"
requests = "^2.31.0"
ruff = "^0.1.6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
