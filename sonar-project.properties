# SonarQube Configuration - Test Data Compliance Guardian
# Project identification
sonar.projectKey=tdr-dealertrack_qa-testing-garage
sonar.projectName=Test Data Compliance Guardian
sonar.projectVersion=1.0.0

# Source directories (exclude tests from sources)
sonar.sources=apps/webhook-inspector/api,apps/webhook-inspector/web/src
sonar.tests=apps/webhook-inspector/api/tests

# Exclusions - Don't scan these (including tests to prevent double-indexing)
sonar.exclusions=**/node_modules/**,**/__pycache__/**,**/venv/**,**/data/**,**/*.pyc,**/dist/**,**/build/**,**/htmlcov/**,.vscode/**,.github/**,docker/**,**/tests/**,**/test_*.py

# Python specific
sonar.python.version=3.11
sonar.python.coverage.reportPaths=apps/webhook-inspector/api/htmlcov/coverage.xml

# JavaScript/TypeScript specific
sonar.javascript.lcov.reportPaths=apps/webhook-inspector/web/coverage/lcov.info

# Source encoding
sonar.sourceEncoding=UTF-8

# Quality Gate (for hackathon - more lenient)
sonar.qualitygate.wait=true

# Coverage thresholds (relaxed for hackathon)
sonar.coverage.exclusions=**/tests/**,**/test_*.py,**/*.test.js,**/*.spec.js

# Duplication detection
sonar.cpd.exclusions=**/tests/**,**/migrations/**

# Language-specific settings
sonar.python.pylint.reportPaths=
sonar.python.bandit.reportPaths=
sonar.python.flake8.reportPaths=
